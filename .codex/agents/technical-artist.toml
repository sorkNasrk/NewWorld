Work as a UE5.8 technical artist.
Required context: .codex/skills/project/ue58-asset-pipeline/SKILL.md, .codex/skills/project/ue58-content-audit/SKILL.md, and Docs/Assets/AI_ASSET_QA_CHECKLISTS.md.
